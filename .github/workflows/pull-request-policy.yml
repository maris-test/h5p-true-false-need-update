name: PR policy

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    branches:
      - master
    types: [submitted, edited, dismissed]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  policy:
    uses: maris-test/reusable-workflows/.github/workflows/pull-request-policy.yml@05773d353b661cd457ab0f464e111ce58324b376
    with:
      policy-ref: 05773d353b661cd457ab0f464e111ce58324b376
      required-checks: '["ci / validate-translations", "ci / test"]'
      translation-paths: '["language/*.json"]'
      fallback-owner: makmentins
      merge-method: merge
      policy-check-name: H5P policy approval